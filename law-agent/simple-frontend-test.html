<!DOCTYPE html>
<html>
<head>
    <title>Frontend Backend Test</title>
</head>
<body>
    <h1>Frontend-Backend Connection Test</h1>
    <p>Open the browser console to see the test results.</p>
    
    <script>
        // Simple test to verify the frontend can connect to the backend
        async function testConnection() {
            try {
                console.log('Testing connection to backend...');
                
                const response = await fetch('https://law-agent-by-grok-1.onrender.com/api/health');
                const data = await response.json();
                
                console.log('Health check response:', data);
                
                if (data.status === 'healthy') {
                    console.log('✅ Backend connection successful!');
                } else {
                    console.log('❌ Backend health check failed:', data);
                }
            } catch (error) {
                console.error('❌ Connection test failed:', error);
            }
        }
        
        // Run the test
        testConnection();
    </script>
</body>
</html>
